<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPD - Store | Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">JPD Store</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="account.html">Account</a>
    </div>
</nav>

<main class="container section-space">
    <div class="page-heading pt-0">
        <div class="eyebrow">Almost Yours</div>
        <h1 class="section-title">Checkout</h1>
        <p class="product-meta">Shipping Details / Payment / Review</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="content-box">
                <h5 class="mb-4">Shipping Address</h5>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Nama Lengkap</label>
                        <input type="text" class="form-control" placeholder="Nama penerima">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Alamat Lengkap</label>
                        <textarea class="form-control" rows="3" placeholder="Alamat lengkap"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Kota</label>
                            <input type="text" class="form-control" placeholder="Kota">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Kode Pos</label>
                            <input type="text" class="form-control" placeholder="Kode pos">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nomor WhatsApp</label>
                        <input type="text" class="form-control" placeholder="08xxxxxxxxxx">
                    </div>

                    <h5 class="mt-4">Payment Method</h5>

                    <select class="form-select mt-3">
                        <option>Transfer Bank</option>
                        <option>QRIS</option>
                        <option>COD</option>
                    </select>

                    <button type="button" class="btn btn-pink w-100 mt-4">
                        Continue to Payment
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="summary">
                <h5>Order Summary</h5>

                <div class="d-flex justify-content-between mt-4">
                    <span>3 Items</span>
                    <b>Rp 587.000</b>
                </div>

                <div class="d-flex justify-content-between mt-2">
                    <span>Shipping</span>
                    <span>Rp 20.000</span>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <b>Total</b>
                    <b>Rp 607.000</b>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-brand">JPD Store</div>
        <p>Simple style, everyday confidence.</p>
        <small>© 2026 JPD Store. Built With Passion.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
