<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JPD Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .login-container h4 {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .description {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-control {
            padding: 13px;
            margin-bottom: 18px;
            border-radius: 6px;
        }

        .btn-login {
            background: #222;
            color: white;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #444;
            color: white;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .register-text a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .footer-text {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">JPD STORE</div>
        <p class="subtitle">FASHION FOR EVERYDAY</p>

        <h4>Welcome Back!</h4>
        <p class="description">Please login to your account.</p>

        <form action="home.html" method="get">

            <label class="form-label">Email Address</label>
            <input type="email" class="form-control"
                placeholder="Enter your email" required>

            <label class="form-label">Password</label>
            <input type="password" class="form-control"
                placeholder="Enter your password" required>

            <button type="submit" class="btn-login">
                LOGIN
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="account.html">Register Now</a>
        </p>

        <p class="footer-text">
            © 2026 JPD Store. All Rights Reserved.
        </p>

    </div>

</body>
</html>
