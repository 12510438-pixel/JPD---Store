<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPD - Store | My Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">JPD Store</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="wishlist.html">Wishlist</a>
    </div>
</nav>

<main class="container section-space">
    <div class="page-heading pt-0">
        <div class="eyebrow">Your Space</div>
        <h1 class="section-title">My Account</h1>
    </div>

    <div class="row g-4">
        <aside class="col-md-3">
            <div class="content-box profile-menu">
                <a class="active" href="account.html">♙ Profile</a>
                <a href="cart.html">▤ My Orders</a>
                <a href="wishlist.html">♡ Wishlist</a>
                <a href="account.html">⌖ Address</a>
                <a href="account.html">⚙ Settings</a>
            </div>
        </aside>

        <section class="col-md-9">
            <div class="content-box">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle d-flex align-items-center justify-content-center"
                         style="width:70px;height:70px;background:#fbeaf1;font-size:2rem;">
                        ♡
                    </div>
                    <div>
                        <h5>Welcome to JPD Store</h5>
                        <p class="product-meta">Manage your profile and orders here.</p>
                    </div>
                </div>

                <hr>

                <h5>Personal Information</h5>

                <form class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Your name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="you@email.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" placeholder="08xxxxxxxxxx">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-12">
                        <button type="button" class="btn btn-pink">Save Changes</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-brand">JPD Store</div>
        <p>Simple style, everyday confidence.</p>
        <small>© 2026 JPD Store. Built With Passion.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
