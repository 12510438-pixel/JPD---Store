<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPD - Store | Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">JPD Store</a>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
    </div>
</nav>

<main class="container section-space">

    <div class="page-heading pt-0">
        <div class="eyebrow">We Are Here to Help</div>
        <h1 class="section-title">Contact Us</h1>
        <p class="product-meta">
            Punya pertanyaan? Kirim pesan kepada kami
        </p>
    </div>

    <div class="row g-4">

        <div class="col-lg-5">

            <div class="contact-card mb-3">
                <h6>Email</h6>
                <p class="product-meta">JPDStore@gmail.com</p>
            </div>

            <div class="contact-card mb-3">
                <h6>Instagram</h6>
                <p class="product-meta">@JPD_store</p>
            </div>

            <div class="contact-card">
                <h6>WhatsApp</h6>
                <p class="product-meta">+62 812-1111-1111</p>
            </div>

        </div>

        <div class="col-lg-7">
            <div class="content-box">

                <form>
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" placeholder="Nama kamu">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="email@example.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="5" placeholder="Tulis pesan kamu..."></textarea>
                    </div>

                    <button type="button" class="btn btn-pink">
                        Send Message →
                    </button>
                </form>

            </div>
        </div>

    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-brand">JPD Store</div>
        <p>Simple style, everyday confidence.</p>
        <small>© 2026 JPD Store. Built With Passion.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
